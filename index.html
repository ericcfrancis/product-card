<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="script.js"></script>

</head>

<body>
    <header class="header">
        <a href="index.html" class="brand">myShop</a>
        <div class="header-right">
            <a href=""><i class="fa-solid fa-cart-shopping"></i></a>
            <a href="">home</a>
            <a href="">about</a>
            <a href="">contact</a>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="row text-center mt-2">
                    <p class="mb-0">featured products
                    <p>
                    <p>popular items</p>
                </div>
            </div>
            <div class="row justify-content-center">
                <!-- card 1 -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb4">
                    <div class="card">
                        <div class="row">
                            <div class="col text-end mx-2">
                                <button class="btn p-0 border-0 bg-transparent like-btn"><i
                                        class="fa-regular fa-heart"></i></button>
                            </div>
                        </div>
                        <img src="images/undraw_netflix_qmju.svg" alt="" class="w-100">
                        <div class="card-body text-center">
                            <div class="row">
                                <h5>Sneakers 1</h5>
                                <p>Best thing to wear</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="row">
                                <div class="col-6">
                                    <p>RM16.00</p>
                                </div>
                                <div class="col-6 text-end">
                                    <button class="btn p-0 border-0 bg-transparent add-to-cart"><i
                                            class="fa-solid fa-cart-plus fa-lg text-danger"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>
</body>

</html>
